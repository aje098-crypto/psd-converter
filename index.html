<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSD → JPG(원본) + PSD(1/10) 자동 변환기</title>
  <script src="https://cdn.jsdelivr.net/npm/ag-psd/dist/bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background-color: #f4f7fb;
      color: #1a2433;
      line-height: 1.5;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #d9e4f2;
      border-radius: 12px;
      padding: 28px 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #0d47a1;
    }
    .subtitle {
      margin: 0 0 24px;
      font-size: 15px;
      color: #4a5b70;
    }
    .name-box {
      background: #f0f6ff;
      border: 1px solid #c5daf7;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .name-box-title {
      font-size: 15px;
      font-weight: 700;
      color: #0d47a1;
      margin-bottom: 10px;
    }
    .name-inputs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .input-group {
      flex: 1;
      min-width: 180px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #2c3e50;
    }
    .input-group input {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #b6cae4;
      border-radius: 8px;
      background: #ffffff;
    }
    .name-hint {
      margin-top: 8px;
      font-size: 13px;
      color: #52657c;
    }
    .drop-zone {
      border: 3px dashed #1e88e5;
      border-radius: 12px;
      background: #f8fbff;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .drop-zone.dragover {
      background: #e3f2fd;
      border-color: #0d47a1;
    }
    .drop-zone-main {
      font-size: 20px;
      font-weight: 700;
      color: #0d47a1;
      margin-bottom: 8px;
    }
    .drop-zone-sub {
      font-size: 15px;
      color: #4a5b70;
      margin-bottom: 16px;
    }
    .btn-primary {
      display: inline-block;
      background: #1565c0;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary:hover { background: #0d47a1; }
    .btn-primary:disabled { background: #9bb8db; cursor: not-allowed; }
    .btn-green {
      background: #1b8a5a;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-green:hover { background: #146c45; }
    .btn-outline {
      background: #ffffff;
      color: #1565c0;
      border: 2px solid #1565c0;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-outline:hover { background: #edf4ff; }
    .btn-small {
      background: #eef5ff;
      color: #0d47a1;
      border: 1px solid #b6d1f5;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-small:hover { background: #dceaff; }
    .btn-clear {
      background: #ffffff;
      color: #607084;
      border: 1px solid #c8d3e0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-left: auto;
    }
    .status-bar {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #edf4ff;
      color: #0d47a1;
      font-size: 15px;
      font-weight: 700;
      display: none;
    }
    .status-bar.error {
      background: #fdecec;
      color: #b71c1c;
    }
    .action-bar {
      display: none;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 2px solid #e6eef8;
    }
    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      display: none;
    }
    .result-table th,
    .result-table td {
      border-bottom: 1px solid #e2eaf4;
      padding: 12px 8px;
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }
    .result-table th {
      background: #f4f8fd;
      color: #2c3e50;
      font-weight: 700;
    }
    .thumb {
      width: 56px;
      height: 56px;
      object-fit: contain;
      border: 1px solid #d5e0ee;
      border-radius: 6px;
      background: #ffffff;
    }
    .file-names {
      font-weight: 700;
      color: #1a2433;
      word-break: break-all;
    }
    .size-info {
      font-size: 13px;
      color: #51647a;
      margin-top: 4px;
    }
    .dl-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PSD 자동 변환기</h1>
    <p class="subtitle">PSD 파일을 올리면 <strong>원본 크기 JPG</strong>와 <strong>1/10 크기 PSD</strong>로 바로 만들어줍니다.</p>

    <div class="name-box">
      <div class="name-box-title">파일명 변경 (선택 사항 — 비워두면 원래 파일명 그대로 저장)</div>
      <div class="name-inputs">
        <div class="input-group">
          <label for="examNoInput">수험번호</label>
          <input type="text" id="examNoInput" placeholder="예: 12345678" />
        </div>
        <div class="input-group">
          <label for="studentNameInput">성명</label>
          <input type="text" id="studentNameInput" placeholder="예: 홍길동" />
        </div>
      </div>
      <div class="name-hint" id="namePreview">
        현재 설정: 올린 파일명 그대로 저장 (예: 수험번호-성명-1.jpg / 수험번호-성명-1.psd)
      </div>
    </div>

    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-main">여기에 PSD 파일을 끌어다 놓거나 클릭하세요</div>
      <div class="drop-zone-sub">여러 개를 한꺼번에 선택해도 자동으로 변환됩니다.</div>
      <button type="button" class="btn-primary" id="selectBtn">PSD 파일 선택하기</button>
      <input type="file" id="fileInput" accept=".psd,image/vnd.adobe.photoshop" multiple style="display:none;" />
    </div>

    <div class="status-bar" id="statusBar"></div>

    <div class="action-bar" id="actionBar">
      <button type="button" class="btn-green" id="saveFolderBtn" style="display:none;">폴더에 바로 저장하기</button>
      <button type="button" class="btn-primary" id="downloadZipBtn">전체 한 번에 받기 (ZIP)</button>
      <button type="button" class="btn-outline" id="downloadAllBtn">개별 파일 모두 받기</button>
      <button type="button" class="btn-clear" id="clearBtn">목록 비우기</button>
    </div>

    <table class="result-table" id="resultTable">
      <thead>
        <tr>
          <th style="width:72px;">미리보기</th>
          <th>저장될 파일명 및 크기</th>
          <th style="width:190px;">개별 저장</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>

  <script>
    const SCALE_RATIO = 0.1; // 가로·세로 1/10 축소
    const JPEG_QUALITY = 0.95;

    const dropZone = document.getElementById("dropZone");
    const selectBtn = document.getElementById("selectBtn");
    const fileInput = document.getElementById("fileInput");
    const examNoInput = document.getElementById("examNoInput");
    const studentNameInput = document.getElementById("studentNameInput");
    const namePreview = document.getElementById("namePreview");
    const statusBar = document.getElementById("statusBar");
    const actionBar = document.getElementById("actionBar");
    const saveFolderBtn = document.getElementById("saveFolderBtn");
    const downloadZipBtn = document.getElementById("downloadZipBtn");
    const downloadAllBtn = document.getElementById("downloadAllBtn");
    const clearBtn = document.getElementById("clearBtn");
    const resultTable = document.getElementById("resultTable");
    const resultBody = document.getElementById("resultBody");

    let convertedItems = [];
    let agPsdModule = null;

    if (typeof window.showDirectoryPicker === "function") {
      saveFolderBtn.style.display = "inline-block";
    }

    async function loadAgPsd() {
      if (agPsdModule) return agPsdModule;
      if (window.agPsd && typeof window.agPsd.readPsd === "function") {
        agPsdModule = window.agPsd;
        return agPsdModule;
      }
      try {
        agPsdModule = await import("https://cdn.jsdelivr.net/npm/ag-psd/+esm");
        return agPsdModule;
      } catch (e) {
        agPsdModule = await import("https://esm.sh/ag-psd");
        return agPsdModule;
      }
    }

    function showStatus(message, isError = false) {
      statusBar.textContent = message;
      statusBar.className = isError ? "status-bar error" : "status-bar";
      statusBar.style.display = "block";
    }

    function sanitizeFilenamePart(str) {
      return str.trim().replace(/[\\/:*?"<>|]/g, "");
    }

    function getOutputBaseName(originalBase, index) {
      const examNo = sanitizeFilenamePart(examNoInput.value);
      const studentName = sanitizeFilenamePart(studentNameInput.value);

      if (!examNo && !studentName) {
        return originalBase;
      }

      const parts = originalBase.split("-");
      const suffix = parts.length > 1 ? parts[parts.length - 1] : String(index + 1);
      const prefixParts = [];
      if (examNo) prefixParts.push(examNo);
      if (studentName) prefixParts.push(studentName);
      prefixParts.push(suffix);
      return prefixParts.join("-");
    }

    function updateNamePreview() {
      const examNo = sanitizeFilenamePart(examNoInput.value);
      const studentName = sanitizeFilenamePart(studentNameInput.value);
      if (!examNo && !studentName) {
        namePreview.textContent = "현재 설정: 올린 파일명 그대로 저장 (예: 수험번호-성명-1.jpg / 수험번호-성명-1.psd)";
      } else {
        const sample = getOutputBaseName("수험번호-성명-1", 0);
        namePreview.textContent = `현재 설정: ${sample}.jpg / ${sample}.psd 형식으로 저장`;
      }
      renderTable();
    }

    examNoInput.addEventListener("input", updateNamePreview);
    studentNameInput.addEventListener("input", updateNamePreview);

    selectBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      fileInput.click();
    });
    dropZone.addEventListener("click", () => fileInput.click());

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });
    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("dragover");
    });
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFiles(Array.from(e.dataTransfer.files));
      }
    });

    fileInput.addEventListener("change", (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFiles(Array.from(e.target.files));
        fileInput.value = "";
      }
    });

    function resizeCanvasSmooth(srcCanvas, targetW, targetH) {
      let curCanvas = srcCanvas;
      let curW = srcCanvas.width;
      let curH = srcCanvas.height;

      while (curW * 0.5 > targetW && curH * 0.5 > targetH) {
        const nextW = Math.max(targetW, Math.round(curW * 0.5));
        const nextH = Math.max(targetH, Math.round(curH * 0.5));
        const stepCanvas = document.createElement("canvas");
        stepCanvas.width = nextW;
        stepCanvas.height = nextH;
        const stepCtx = stepCanvas.getContext("2d");
        stepCtx.imageSmoothingEnabled = true;
        stepCtx.imageSmoothingQuality = "high";
        stepCtx.drawImage(curCanvas, 0, 0, nextW, nextH);
        curCanvas = stepCanvas;
        curW = nextW;
        curH = nextH;
      }

      const outCanvas = document.createElement("canvas");
      outCanvas.width = targetW;
      outCanvas.height = targetH;
      const outCtx = outCanvas.getContext("2d");
      outCtx.imageSmoothingEnabled = true;
      outCtx.imageSmoothingQuality = "high";
      outCtx.drawImage(curCanvas, 0, 0, targetW, targetH);
      return outCanvas;
    }

    function buildCompositeCanvas(psd) {
      if (psd.canvas) {
        return psd.canvas;
      }
      const canvas = document.createElement("canvas");
      canvas.width = psd.width;
      canvas.height = psd.height;
      const ctx = canvas.getContext("2d");

      function drawLayers(layers) {
        if (!layers) return;
        for (const layer of layers) {
          if (layer.hidden) continue;
          if (layer.children) {
            drawLayers(layer.children);
          } else if (layer.canvas) {
            ctx.save();
            ctx.globalAlpha = typeof layer.opacity === "number" ? layer.opacity : 1;
            ctx.drawImage(layer.canvas, layer.left || 0, layer.top || 0);
            ctx.restore();
          }
        }
      }
      drawLayers(psd.children);
      return canvas;
    }

    function resizeLayerTree(layers, scale) {
      if (!Array.isArray(layers)) return undefined;
      return layers.map((layer) => {
        const base = {
          name: layer.name || "Layer",
          hidden: Boolean(layer.hidden),
          opacity: typeof layer.opacity === "number" ? layer.opacity : 1,
          blendMode: layer.blendMode || "normal"
        };

        if (Array.isArray(layer.children)) {
          return {
            ...base,
            opened: layer.opened !== false,
            children: resizeLayerTree(layer.children, scale)
          };
        }

        if (layer.canvas && layer.canvas.width > 0 && layer.canvas.height > 0) {
          const newW = Math.max(1, Math.round(layer.canvas.width * scale));
          const newH = Math.max(1, Math.round(layer.canvas.height * scale));
          const resizedLayerCanvas = resizeCanvasSmooth(layer.canvas, newW, newH);
          return {
            ...base,
            left: Math.round((layer.left || 0) * scale),
            top: Math.round((layer.top || 0) * scale),
            canvas: resizedLayerCanvas
          };
        }

        return base;
      });
    }

    function canvasToJpgBlob(srcCanvas, quality) {
      const jpgCanvas = document.createElement("canvas");
      jpgCanvas.width = srcCanvas.width;
      jpgCanvas.height = srcCanvas.height;
      const ctx = jpgCanvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, jpgCanvas.width, jpgCanvas.height);
      ctx.drawImage(srcCanvas, 0, 0);

      return new Promise((resolve, reject) => {
        jpgCanvas.toBlob(
          (blob) => (blob ? resolve(blob) : reject(new Error("JPG 생성 실패"))),
          "image/jpeg",
          quality
        );
      });
    }

    async function convertSinglePsd(file, agPsd) {
      const arrayBuffer = await file.arrayBuffer();
      const psd = agPsd.readPsd(arrayBuffer);

      const origW = psd.width;
      const origH = psd.height;
      const smallW = Math.max(1, Math.round(origW * SCALE_RATIO));
      const smallH = Math.max(1, Math.round(origH * SCALE_RATIO));

      // 1. 원본 크기 JPG 생성
      const compositeCanvas = buildCompositeCanvas(psd);
      const jpgBlob = await canvasToJpgBlob(compositeCanvas, JPEG_QUALITY);
      const previewUrl = URL.createObjectURL(jpgBlob);

      // 2. 가로·세로 1/10 크기 PSD 생성
      const resizedComposite = resizeCanvasSmooth(compositeCanvas, smallW, smallH);
      const resizedChildren = resizeLayerTree(psd.children, SCALE_RATIO);

      const newPsdObj = {
        width: smallW,
        height: smallH,
        channels: 3,
        bitsPerChannel: 8,
        colorMode: 3,
        canvas: resizedComposite
      };
      if (resizedChildren && resizedChildren.length > 0) {
        newPsdObj.children = resizedChildren;
      }

      const psdBuffer = agPsd.writePsd(newPsdObj, { generateThumbnail: true });
      const psdBlob = new Blob([psdBuffer], { type: "image/vnd.adobe.photoshop" });

      const normalizedName = file.name.normalize("NFC");
      const originalBase = normalizedName.replace(/\.psd$/i, "");

      return {
        originalBase,
        origW,
        origH,
        smallW,
        smallH,
        jpgBlob,
        psdBlob,
        previewUrl
      };
    }

    async function handleFiles(files) {
      const psdFiles = files.filter((f) => /\.psd$/i.test(f.name));
      if (psdFiles.length === 0) {
        showStatus("PSD 파일(.psd)만 선택해 주세요.", true);
        return;
      }

      psdFiles.sort((a, b) => a.name.localeCompare(b.name, "ko", { numeric: true }));

      showStatus(`변환 준비 중... (총 ${psdFiles.length}개)`);
      let agPsd;
      try {
        agPsd = await loadAgPsd();
      } catch (err) {
        showStatus("변환 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.", true);
        return;
      }

      let successCount = 0;
      const errors = [];

      for (let i = 0; i < psdFiles.length; i++) {
        const file = psdFiles[i];
        showStatus(`변환 중... (${i + 1} / ${psdFiles.length}) : ${file.name.normalize("NFC")}`);
        try {
          const item = await convertSinglePsd(file, agPsd);
          convertedItems.push(item);
          successCount++;
          renderTable();
        } catch (err) {
          console.error(err);
          errors.push(`${file.name.normalize("NFC")} (${err.message})`);
        }
      }

      if (errors.length > 0) {
        showStatus(`완료: ${successCount}개 성공 / ${errors.length}개 실패 — ${errors.join(", ")}`, true);
      } else {
        showStatus(`변환 완료! 총 ${convertedItems.length}개 파일이 준비되었습니다. 아래 버튼을 눌러 저장하세요.`);
      }
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function renderTable() {
      if (convertedItems.length === 0) {
        actionBar.style.display = "none";
        resultTable.style.display = "none";
        resultBody.innerHTML = "";
        return;
      }

      actionBar.style.display = "flex";
      resultTable.style.display = "table";
      resultBody.innerHTML = "";

      convertedItems.forEach((item, index) => {
        const baseName = getOutputBaseName(item.originalBase, index);
        const jpgName = `${baseName}.jpg`;
        const psdName = `${baseName}.psd`;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><img class="thumb" src="${item.previewUrl}" alt="미리보기" /></td>
          <td>
            <div class="file-names">${jpgName}</div>
            <div class="file-names">${psdName}</div>
            <div class="size-info">JPG 원본: ${item.origW} × ${item.origH}px &nbsp;|&nbsp; PSD 1/10: ${item.smallW} × ${item.smallH}px</div>
          </td>
          <td>
            <div class="dl-btns">
              <button type="button" class="btn-small" data-type="jpg" data-idx="${index}">JPG 받기</button>
              <button type="button" class="btn-small" data-type="psd" data-idx="${index}">PSD 받기</button>
            </div>
          </td>
        `;
        resultBody.appendChild(tr);
      });
    }

    resultBody.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-type]");
      if (!btn) return;
      const idx = Number(btn.dataset.idx);
      const type = btn.dataset.type;
      const item = convertedItems[idx];
      if (!item) return;

      const baseName = getOutputBaseName(item.originalBase, idx);
      if (type === "jpg") {
        triggerDownload(item.jpgBlob, `${baseName}.jpg`);
      } else {
        triggerDownload(item.psdBlob, `${baseName}.psd`);
      }
    });

    downloadZipBtn.addEventListener("click", async () => {
      if (convertedItems.length === 0) return;
      if (typeof JSZip === "undefined") {
        showStatus("ZIP 라이브러리를 불러오지 못했습니다. 개별 파일 모두 받기를 사용해 주세요.", true);
        return;
      }

      showStatus("ZIP 파일로 묶는 중...");
      const zip = new JSZip();
      convertedItems.forEach((item, index) => {
        const baseName = getOutputBaseName(item.originalBase, index);
        zip.file(`${baseName}.jpg`, item.jpgBlob);
        zip.file(`${baseName}.psd`, item.psdBlob);
      });

      const zipBlob = await zip.generateAsync({ type: "blob" });
      const firstBase = getOutputBaseName(convertedItems[0].originalBase, 0);
      const zipName = convertedItems.length === 1 ? `${firstBase}.zip` : `${firstBase}_외_${convertedItems.length - 1}건.zip`;
      triggerDownload(zipBlob, zipName);
      showStatus("ZIP 파일 다운로드가 시작되었습니다.");
    });

    downloadAllBtn.addEventListener("click", async () => {
      if (convertedItems.length === 0) return;
      showStatus("개별 파일 다운로드를 진행 중입니다... (브라우저 상단에 '여러 파일 다운로드 허용'이 뜨면 허용을 눌러주세요)");
      for (let i = 0; i < convertedItems.length; i++) {
        const item = convertedItems[i];
        const baseName = getOutputBaseName(item.originalBase, i);
        triggerDownload(item.jpgBlob, `${baseName}.jpg`);
        await new Promise((r) => setTimeout(r, 250));
        triggerDownload(item.psdBlob, `${baseName}.psd`);
        await new Promise((r) => setTimeout(r, 250));
      }
      showStatus(`총 ${convertedItems.length * 2}개 파일 다운로드가 완료되었습니다.`);
    });

    saveFolderBtn.addEventListener("click", async () => {
      if (convertedItems.length === 0) return;
      try {
        const dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
        showStatus("선택한 폴더에 저장 중...");
        for (let i = 0; i < convertedItems.length; i++) {
          const item = convertedItems[i];
          const baseName = getOutputBaseName(item.originalBase, i);

          const jpgHandle = await dirHandle.getFileHandle(`${baseName}.jpg`, { create: true });
          const jpgWritable = await jpgHandle.createWritable();
          await jpgWritable.write(item.jpgBlob);
          await jpgWritable.close();

          const psdHandle = await dirHandle.getFileHandle(`${baseName}.psd`, { create: true });
          const psdWritable = await psdHandle.createWritable();
          await psdWritable.write(item.psdBlob);
          await psdWritable.close();
        }
        showStatus(`선택한 폴더에 총 ${convertedItems.length * 2}개 파일이 저장되었습니다!`);
      } catch (err) {
        if (err.name !== "AbortError") {
          showStatus(`폴더 저장 중 오류가 발생했습니다: ${err.message}`, true);
        }
      }
    });

    clearBtn.addEventListener("click", () => {
      convertedItems.forEach((item) => URL.revokeObjectURL(item.previewUrl));
      convertedItems = [];
      renderTable();
      statusBar.style.display = "none";
    });
  </script>
</body>
</html>
